<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindOdyssey · Le jeu d’aventure éducatif du CE1 à la 6e</title>
    <!--
      81 est remplacé à la compilation par le plugin `comptesDuCorpus` de
      `vite.config.ts`, qui lit `src/corpus.json` — généré par
      `python3 tools/build_catalog.py` en même temps que MANIFEST.md.

      Ce bloc portait « résolvez soixante missions », SANS le mot « écrites », quand
      le corpus en comptait 79 : deux fautes dans le texte que lisent les moteurs de
      recherche, dont l'une est exactement la formulation que la règle 2 de
      `src/App.tsx` s'interdit à elle-même. Un jeton non substitué reste visible dans
      le HTML produit — l'échec est bruyant, pas silencieux.
    -->
    <meta name="description" content="Explorez dix mondes historiques et découvrez 81 missions écrites, faisant appel à des notions scolaires du CE1 à la 6e. Un village grandit de tout ce que votre enfant y apprend." />
    <meta name="theme-color" content="#050d20" />
    <meta name="color-scheme" content="dark" />
    <!--
      APERÇU DE PARTAGE. Ce bloc est ce qui s'affiche quand le lien est collé
      dans une conversation, et c'est la seule chose que verront ceux qui ne
      cliquent pas.

      LES DEUX URL CI-DESSOUS SONT LES SEULES ABSOLUES DE TOUT LE SITE, et elles
      doivent l'être : un `og:image` relatif n'est résolu par aucun robot. Tout
      le reste du site est en chemins relatifs (`base: "./"` dans
      `vite.config.ts`), donc déplaçable sans rien changer. Ces deux lignes, non.
      **En cas de nom de domaine propre, ce sont les deux seules à reprendre.**
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MindOdyssey" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="MindOdyssey · Le jeu d’aventure éducatif du CE1 à la 6e" />
    <meta property="og:description" content="Dix mondes historiques, 81 missions écrites, un village qui grandit. Pour les 7-12 ans, du CE1 à la 6e." />
    <meta property="og:url" content="https://loukan42.github.io/MindOdyssey-public/" />
    <meta property="og:image" content="https://loukan42.github.io/MindOdyssey-public/theme/partage.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Un panorama où se succèdent une cité antique, une ville médiévale, un dirigeable du début du XXe siècle et des tours de verre, avec le logo MindOdyssey au centre." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://loukan42.github.io/MindOdyssey-public/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
